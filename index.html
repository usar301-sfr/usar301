<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#15202b; --navy2:#1f2d3b; --bg:#eceef1; --card:#fff; --ink:#18212b; --muted:#6a7482; --line:#dde1e6;
  --accent:#d2492a; --accent-ink:#fff; --ok:#2e7d32; --ok-bg:#e3f1e4; --short:#9a6400; --short-bg:#fff2d6;
  --miss:#b3261e; --miss-bg:#fbe3e1; --tbd:#5b6470; --tbd-bg:#eceff2; --sel:#15202b;
  --head:'Barlow Condensed', 'Arial Narrow', sans-serif; --body:'Inter', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
header.top img{width:30px;height:33px;object-fit:contain;background:#fff;border-radius:6px;padding:1px}
header.top .brand{font-family:var(--head);font-weight:700;font-size:21px;letter-spacing:.5px;white-space:nowrap}
header.top{gap:8px}
.homebtn{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:2px 4px 2px 0;cursor:pointer;border-radius:10px}
.homebtn:active{opacity:.7}.homebtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media(max-width:400px){header.top .iconbtn{width:36px;height:36px}.pill{padding:4px 8px}}
header.top .sp{flex:1}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.live{background:#d9f2dc;color:#1b5e20}.pill.saving{background:#fff1c2;color:#7a5600}
.pill.off{background:#ffd9d6;color:#9b1c13}.pill.demo{background:#dfe7f5;color:#22406e}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px 12px 90px}
h1{font-family:var(--head);font-weight:700;font-size:26px;letter-spacing:.4px;margin:6px 0 2px;text-transform:uppercase}
h1 small{font-size:13px;color:var(--muted);letter-spacing:.8px;margin-left:6px;font-weight:600}
h2{font-family:var(--head);font-weight:700;font-size:19px;letter-spacing:.5px;margin:22px 0 8px;text-transform:uppercase;color:#3a4552}
.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.navcard{cursor:pointer}
.navcard h3{font-family:var(--head);font-size:21px;margin:0 0 4px;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.navcard p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tbd-bg);color:#2d3642}
.tag.accent{background:var(--accent);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.tile b{display:block;font-family:var(--head);font-size:28px;line-height:1}
.tile span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
button.tile{text-align:left;cursor:pointer;font:inherit;color:inherit}
button.tile:active{transform:scale(.98)}
.tile em{display:block;font-style:normal;font-size:11.5px;font-weight:600;color:var(--accent);margin-top:4px}
.tile.alert{border-color:var(--miss);background:var(--miss-bg)}
@media(max-width:420px){.tiles{grid-template-columns:repeat(2,1fr)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.chip.on{background:var(--sel);color:#fff;border-color:var(--sel)}.chip.on small{color:#cfd6de}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;margin:6px 0}
.hero{text-align:center;margin:6px 0 14px}
.hero h1{font-size:48px;line-height:1;letter-spacing:2px;margin:0;color:var(--navy,#15202b)}
.hero .sub{font-size:15px;font-weight:700;letter-spacing:.8px;line-height:1.35;text-transform:uppercase;margin:8px 0 0;color:#b23a1d}

@media print{.wm{display:none}}
h2.hh{font-size:26px;margin:22px 0 10px;letter-spacing:.6px}
.lochd{display:flex;align-items:center;gap:8px;width:100%;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lochd .chev{font-size:17px;width:18px;opacity:.85}
.lochd .seccnt{font-family:var(--body,inherit);font-size:14px;font-weight:700;letter-spacing:0;background:rgba(255,255,255,.18);border-radius:12px;padding:3px 10px}
.pcrow{display:flex;align-items:center;gap:8px}
.pcrow .stepper{margin-left:auto}
.pcrow.on .nm{color:#7a4f00;font-weight:800}
.pcav{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.lochd .secbad.low{background:#ffefc7;color:#7a4f00}
.lochd .secbad{font-family:var(--body,inherit);font-size:13px;font-weight:800;letter-spacing:.2px;text-transform:none;background:#fde0dc;color:#9b1c13;border-radius:10px;padding:2px 8px}
.loc{font-family:var(--head);font-size:22px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:#fff;background:var(--navy2);padding:14px 14px;border-radius:11px;margin:14px 0 8px;min-height:54px;line-height:1.15}
.kitpcs{font-size:12.5px;font-weight:700;color:#7a4f00;margin-top:3px}
.item.tone-short{background:#fff8e7;border-color:#f1d491;box-shadow:inset 5px 0 0 #e3a21a}
.item.tone-missing{background:#fdeceb;border-color:#eba8a2;box-shadow:inset 5px 0 0 var(--miss)}
.item.tone-missing .cnt b{color:var(--miss)}
.item.tone-short .cnt b{color:var(--short)}
.item.tone-out{background:#eef4fc;border-color:#b9cde8;box-shadow:inset 5px 0 0 #3b6fb6}
.st.missing{font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:2px 2px 10px}
.legend span{display:flex;align-items:center;gap:6px}
.lg{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid}
.lg.low{background:#fff8e7;border-color:#e3a21a}.lg.out{background:#fdeceb;border-color:var(--miss)}.lg.iss{background:#eef4fc;border-color:#3b6fb6}
.item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin:6px 0;cursor:pointer}
.item .nm{font-weight:600;font-size:14.5px}
.ctab{flex:none;align-self:stretch;width:74px;margin:-11px 0 -11px -12px;border-radius:10px 0 0 10px;display:grid;place-items:center;
  font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.4px;text-transform:uppercase}
.c-Yellow{background:#f5d90a;color:#1b1b1b}.c-Red{background:#c8102e;color:#fff}.c-Orange{background:#ec9a1e;color:#1b1b1b}
.c-Green{background:#3c9a3f;color:#fff}.c-Blue{background:#1f5fae;color:#fff}.c-Grey,.c-Gray{background:#8a939c;color:#fff}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.item .meta{color:var(--muted);font-size:12px;margin-top:2px}
.item .cnt{margin-left:auto;text-align:right;flex:none}
.item .cnt b{font-family:var(--head);font-size:22px}
.item .cnt span{color:var(--muted);font-size:13px}
.st{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.st.ok{background:var(--ok-bg);color:var(--ok)}.st.short{background:var(--short-bg);color:var(--short)}
.st.out{background:#dfe7f5;color:#22406e}
.st.missing{background:var(--miss-bg);color:var(--miss)}.st.tbd,.st.unchecked{background:var(--tbd-bg);color:var(--tbd)}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer;background:#e7eaee}
.btn.primary{background:var(--accent);color:#fff}.btn.dark{background:var(--navy);color:#fff}
.btn.block{width:100%}
.secprog{white-space:nowrap;flex:none;margin-left:8px;font-family:var(--body);font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;color:#cfd6de}
.secprog.done{color:#9be29f}
.lochd .secprog{font-size:14px;font-weight:700}
.tcgrid{display:grid;grid-template-columns:1fr 1.25fr;gap:10px}
.tcgrid .in{width:100%;box-sizing:border-box;min-width:0}
.secnote{margin:0 0 4px;border-radius:0 0 12px 12px;background:#fbfbfc}
.in.needctx-in{border:2px solid var(--miss);background:var(--miss-bg)}
.secbar{display:grid;grid-template-columns:1fr;gap:8px;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 11px 11px;padding:8px;margin-bottom:6px}
.btn.match{background:var(--ok);color:#fff;padding:11px 10px;font-size:14px}
.btn.clear{background:#fff;border:1.5px solid var(--miss);color:var(--miss);padding:11px 10px;font-size:14px}
.btn.danger{background:var(--miss);color:#fff}
.trainbtn{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:600;font-size:14.5px;cursor:pointer;text-align:left}
.trainbtn .tbox{width:24px;height:24px;border-radius:6px;border:2px solid #9aa3ad;display:grid;place-items:center;font-size:15px;color:#fff;flex:none}
.trainbtn.on{border-color:#5b3fb0;background:#efeaff;color:#3d2a7d}.trainbtn.on .tbox{background:#5b3fb0;border-color:#5b3fb0}
.a.TRAIN{background:#efeaff;color:#4a33a0}
.ctxsum{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px 12px;border:1.5px solid}
.ctxsum>div{flex:1;min-width:0}.ctxsum .btn{padding:8px 12px;flex:none;background:#fff}
.ctxsum.inc{background:#e8f0fb;border-color:#1f4f8f}.ctxsum.trn{background:#efeaff;border-color:#5b3fb0}
.ctxk{font-weight:800;font-size:14px}.ctxd{font-size:13px;color:#3a4552;margin-top:2px;overflow-wrap:anywhere}.a.INC{background:#e3ecf9;color:#1f4f8f}
.kindseg{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-radius:12px}
.kindseg.bad{outline:2px solid var(--miss);outline-offset:3px}
.card.needctx{border:2px solid var(--miss);background:var(--miss-bg)}
.kindseg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:13px 8px;font-weight:700;font-size:15px;cursor:pointer}
.kindseg button.on.inc{background:#1f4f8f;border-color:#1f4f8f;color:#fff}
.kindseg button.on.trn{background:#5b3fb0;border-color:#5b3fb0;color:#fff}
.req{color:var(--miss)}
input.in.bad{border-color:var(--miss);background:var(--miss-bg)}
.trainbtn{margin-top:4px}
.stepper .slotclr{width:32px;height:36px;border-radius:9px;border:1.5px solid var(--miss);background:#fff;color:var(--miss);font-size:14px;font-weight:700;cursor:pointer;margin-left:2px}
.stepper .slotclr[hidden]{display:inline-block;visibility:hidden}

/* ---------- storage helpers (work even where browser storage is blocked) ---------- */
const mem = {};
function sget(k){ try{ const v = localStorage.getItem(k); return v===null? (mem[k]??null) : v; }catch(e){ return mem[k]??null; } }
function sset(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }

/* ---------- backend: Google Apps Script when deployed, demo data otherwise ---------- */
/* Two ways to be live: inside Google Apps Script (google.script.run), or the GitHub Pages copy that
   calls the Apps Script web app URL set in config.js (window.USAR301_API). Otherwise: preview/demo. */
const GAS = !!(window.google && google.script && google.script.run);
const API_URL = String(window.USAR301_API || '').trim();
const LIVE = GAS || !!API_URL;
function gas(fn, ...args){
  if (GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  return fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn, args}) })
    .then(r => { if(!r.ok) throw new Error('Server error '+r.status); return r.json(); })
    .then(j => { if (j && j.error) throw new Error(j.error); return j ? j.result : null; });
}
const demo = {
  load(){
    const saved = sget('usar301_demo_v61');
    if (saved) { try { return JSON.parse(saved); } catch(e){} }
    const items = SEED.map((it,i)=>({id:'I'+String(i+1).padStart(3,'0'), loc:it.loc, cat:it.cat, item:it.item, unit:it.unit,
      full:it.full, onHand:it.full, spec:it.spec||'', src:it.src||'', price:it.price??null, notes:it.notes||'', updated:'', updatedBy:'Setup', color:it.color||'', kit:it.kit||[]}));
    return {items, log:[]};
  },
  save(d){ sset('usar301_demo_v61', JSON.stringify(d)); },
  async getData(){ const d = this.load(); return d; },
  async logEntry(e){
    const d = this.load(); const now = new Date().toISOString();
    (e.lines||[]).forEach(l=>{
      const it = d.items.find(x=>x.id===l.id); if(!it) return;
      const q = Math.max(0, Number(l.qty)||0); if(e.action!=='COUNT' && !q) return;
      const pc = l.piece ? String(l.piece) : ''; if(pc && e.action==='COUNT') return;
      const after = pc ? (it.onHand||0) : e.action==='COUNT' ? q : Math.max(0, (it.onHand||0) + SIGN[e.action]*q);
      if(!pc){ it.onHand = after; it.updated = now; it.updatedBy = e.name + (e.unit? ' – '+e.unit:''); }
      const ln = l.note||e.notes||'';
      d.log.unshift({ts:now, action:e.action, id:it.id, item:pc? it.item+' › '+pc : it.item, qty:q, after, incident:e.incident||'', name:e.name, unit:e.unit||'', notes:pc? 'Kit piece: '+pc+(ln?' · '+ln:'') : ln, kind:e.kind||'', details:e.details||''});
    });
    if(e.action==='COUNT' && Array.isArray(e.secNotes)) e.secNotes.slice().reverse().forEach(s=>{ if(s&&String(s.note||'').trim()) d.log.unshift({ts:now, action:'CHECK', id:'', item:'Section note – '+s.loc, qty:'', after:'', incident:'', name:e.name, unit:e.unit||'', notes:s.note, kind:'Check-off', details:''}); });
    if(e.action==='COUNT' && e.truck) d.log.unshift({ts:now, action:'CHECK', id:'', item:'Truck check', qty:'', after:'', incident:'', name:e.name, unit:e.unit||'', notes:e.truck, kind:'Check-off', details:''});
    this.save(d); return d;
  }
};

async function wxDirect(lat,lon){
  const ll=(+lat).toFixed(4)+','+(+lon).toFixed(4);
  const get=u=>fetch(u,{headers:u.includes('weather.gov')?{Accept:'application/geo+json'}:{}}).then(r=>r.ok?r.json():null).catch(()=>null);
  const [om,pt,al]=await Promise.all([get(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,is_day&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_gusts_10m_max,sunrise,sunset,uv_index_max&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto&forecast_days=3`),
    get('https://api.weather.gov/points/'+ll), get('https://api.weather.gov/alerts/active?point='+ll)]);
  return {om,pt,al};
}

/* piece count on a full load: kits count every piece inside (e.g. 5 tool belts x 6 pieces = 30) */
const pieces = i => { const f=Number(i.full)||0; return (Array.isArray(i.kit)&&i.kit.length) ? f*i.kit.reduce((a,k)=>a+(Number(k.q)||0),0) : f; };
const sumPieces = arr => arr.reduce((a,i)=>a+pieces(i),0);
const kitOut = it => (Array.isArray(it.kit)&&it.kit.length) ? kitHolders(it.id).reduce((a,[,q])=>a+q,0) : 0;
function status(it){
  if (it.full===null || it.full===undefined || it.full==='') return 'tbd';
  if (it.onHand===null || it.onHand===undefined || it.onHand==='') return 'unchecked';
  if (it.onHand >= it.full) return 'ok';
  const out = kitOut(it);
  if (out && it.onHand + out >= it.full) return 'out';
  if (Number(it.onHand) === 0 && !out) return 'missing';
  return 'short';
}
const ST_LABEL = {out:'Issued out', ok:'OK', short:'Short', missing:'Missing', tbd:'Full load TBD', unchecked:'Not counted'};
const need = it => (status(it)==='short'||status(it)==='missing') ? Math.max(0, it.full - it.onHand - kitOut(it)) : 0;
function fmtTime(ts){ if(!ts) return ''; const d=new Date(ts); if(isNaN(d)) return String(ts);
  return d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'2-digit'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}); }

let lastSig='';
async function refresh(silent){
  if(!silent) setStatus('saving','Syncing…');
  try{
    const d = await api.getData(); lastSync=new Date();
    const sig = JSON.stringify([d.items.map(i=>[i.id,i.onHand,i.full,i.item,i.loc]), d.log.length, d.log[0]&&d.log[0].ts]);
    S.items=d.items; S.log=d.log; S.apiv = LIVE ? (d.apiVersion||1) : 2; if(d.crew&&d.crew.length){ S.crew=d.crew; syncMe(); } idle();
    if(sig!==lastSig || !silent) S.rep.all=null;
    if(!silent || sig!==lastSig) render();
    lastSig=sig;
  }
  catch(e){ setStatus('off','Offline'); if(!silent) toast('Could not load: '+(e.message||e)); }
}

// Returning/restocking more than the truck carries: warn and require a note on where the extra came from
function overLines(entry){ if(entry.action!=='RETURNED'&&entry.action!=='RESTOCKED') return [];
  return (entry.lines||[]).filter(l=>!l.piece).map(l=>{ const it=S.items.find(x=>x.id===l.id); if(!it) return null;
    const full=Number(it.full); if(it.full===''||it.full==null||!isFinite(full)) return null;
    const after=(Number(it.onHand)||0)+(Number(l.qty)||0); return after>full? {l,it,after,full,extra:after-full} : null; }).filter(Boolean); }
function overWarn(entry, ov){ return new Promise(res=>{
  const verb=entry.action==='RETURNED'?'return':'restock';
  const d=document.createElement('div'); d.className='ovw-bg';
  d.innerHTML=`<div class="ovw" role="dialog" aria-modal="true">
    <div class="ovw-h">⚠ More than a full load</div>
    <p>This ${verb} puts more on the truck than it's supposed to carry:</p>
    ${ov.map(o=>`<div class="ovw-r"><b>${esc(o.it.item)}</b><span>${o.after} on truck · full load ${o.full}</span><em>+${o.extra} extra</em></div>`).join('')}
    <label class="f" for="ovwN">Where did the extra come from? <span style="color:var(--miss)">(required)</span></label>
    <textarea id="ovwN" rows="3" placeholder="e.g. Mutual aid gear from Goose Creek, picked up another unit's straps, count was off…"></textarea>
    <div class="ovw-b"><button class="btn" id="ovwBack">Go back</button><button class="btn dark" id="ovwGo" disabled>Log it with note</button></div></div>`;
  document.body.appendChild(d);
  const n=d.querySelector('#ovwN'), go=d.querySelector('#ovwGo'); setTimeout(()=>n.focus(),50);
  n.oninput=()=>{ go.disabled=!n.value.trim(); };
  const done=v=>{ d.remove(); res(v); };
  d.querySelector('#ovwBack').onclick=()=>done(null);
  go.onclick=()=>{ const v=n.value.trim(); if(v) done(v); };
}); }
async function submit(entry){
  if(!S.me){ signIn(()=>submit(entry)); return false; }
  const ov=overLines(entry);
  if(ov.length){ const why=await overWarn(entry, ov); if(!why) return false;
    ov.forEach(o=>{ o.l.note=(o.l.note||entry.notes||'')+((o.l.note||entry.notes)?' · ':'')+`OVER FULL LOAD +${o.extra} (${o.after}/${o.full}): ${why}`; }); }
  entry.name=S.me.name; entry.unit=S.me.unit;
  setStatus('saving','Saving…');
  try{ const d = await api.logEntry(entry); S.items=d.items; S.log=d.log; S.rep.all=null; lastSync=new Date(); idle(); render(); return true; }
  catch(e){ setStatus('off','Not saved'); toast('Not saved: '+(e.message||e)); return false; }
}

function openSheet(html, onMount){ const sh=$('#sheet'), was=sh.classList.contains('open'), y=sh.scrollTop; sh.style.transform=''; sh.style.transition='';
  sh.innerHTML='<div class="sheet-top"><div class="grab"></div><button class="sheet-x" aria-label="Close" onclick="closeSheet()">&times;</button></div>'+html;
  sh.scrollTop=was?y:0; sh.classList.add('open'); $('#sheetBg').style.display='block'; onMount&&onMount(); }
function closeSheet(){ const sh=$('#sheet'); sh.style.transform=''; sh.style.transition=''; sh.classList.remove('open'); $('#sheetBg').style.display='none'; }
// Swipe down to close: drag from the top bar, or anywhere when the sheet is scrolled to the top
(function(){ const sh=$('#sheet'); let y0=null, dy=0, drag=false;
  sh.addEventListener('touchstart',e=>{ if(e.target.closest('.sheet-x')) return;
    const onTop=!!e.target.closest('.sheet-top');
    if(onTop || sh.scrollTop<=0){ y0=e.touches[0].clientY; dy=0; drag=onTop; } else y0=null; },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0==null) return; const d=e.touches[0].clientY-y0;
    if(!drag){ if(d>8 && sh.scrollTop<=0) drag=true; else if(d<0){ y0=null; return; } else return; }
    dy=Math.max(0,d); sh.style.transition='none'; sh.style.transform='translateY('+dy+'px)'; e.preventDefault(); },{passive:false});
  const end=()=>{ if(y0==null) return; y0=null; if(!drag) return; drag=false; sh.style.transition='';
    if(dy>90) closeSheet(); else sh.style.transform=''; dy=0; };
  sh.addEventListener('touchend',end); sh.addEventListener('touchcancel',end);
})();
$('#sheetBg').onclick = closeSheet;

function signIn(after){
  const shifts=[...new Set(S.crew.map(c=>c.shift))].sort((a,b)=>(a==='Staff')-(b==='Staff')||a.localeCompare(b));
  const st={shift: S.me?.shift && shifts.includes(S.me.shift) ? S.me.shift : shifts[0], q:'', manual:false};
  const pick=(c)=>{ S.me={name:c.name, unit:c.shift==='Staff'||!c.shift? c.unit : `${c.unit} · ${c.shift} Shift`, shift:c.shift};
    sset('usar301_me', JSON.stringify(S.me)); closeSheet(); toast('Signed in as '+c.name); after&&after(); };
  const list=()=>{
    const q=st.q.trim().toLowerCase();
    const rows=S.crew.filter(c=> q ? (c.name+' '+c.unit).toLowerCase().includes(q) : c.shift===st.shift);
    if(!rows.length) return '<div class="empty" style="padding:16px">No match. Use “Not on the list” below.</div>';
    const g={}; rows.forEach(c=>{ const k=c.shift==='Staff'? 'Staff' : q? `${c.unit} · ${c.shift} Shift` : c.unit; (g[k]=g[k]||[]).push(c); });
    return Object.entries(g).map(([u,cs])=>`<div class="crewunit">${esc(u)}</div>`+cs.map(c=>{ const i=S.crew.indexOf(c);
      return `<button class="crewbtn ${S.me&&S.me.name===c.name?'me':''}" data-crew="${i}"><span>${esc(c.name)}${c.shift==='Staff'?`<span class="muted" style="display:block;font-size:12px;font-weight:500">${esc(c.unit)}</span>`:''}</span><span class="pos">${esc(c.pos)}</span></button>`; }).join('')).join('');
  };
  const draw=()=>{
    $('#siChips').innerHTML=shifts.map(s=>`<button class="chip ${!st.q&&st.shift===s?'on':''}" data-sh="${esc(s)}">${s==='Staff'?'Staff':s+' Shift'}</button>`).join('');
    $('#siList').innerHTML=list();
    document.querySelectorAll('[data-sh]').forEach(b=>b.onclick=()=>{ st.shift=b.dataset.sh; st.q=''; $('#siQ').value=''; draw(); $('#siList').scrollTop=0; });
    document.querySelectorAll('[data-crew]').forEach(b=>b.onclick=()=>pick(S.crew[+b.dataset.crew]));
  };
  openSheet(`<h3>Who's logging?</h3><p class="sub">Pick your shift, then tap your name. It's remembered on this phone.</p>
    <div class="chips" id="siChips"></div>
    <input class="search" id="siQ" placeholder="Or search any name" autocomplete="off" style="margin-top:4px">
    <div class="crewlist" id="siList"></div>
    <button class="btn block" id="siManual" style="margin-top:10px">Not on the list? Type your name</button>
    <div id="siMan" style="display:none">
      <label class="f">Name</label><input class="in" id="siName" autocomplete="name" placeholder="First and last name" value="${esc(S.me?.name||'')}">
      <label class="f">Assigned unit</label><input class="in" id="siUnit" placeholder="e.g. Eng. 306" value="${esc(S.me?.unit||'')}">
      <div style="height:14px"></div><button class="btn primary block" id="siGo">Continue</button></div>`, ()=>{
    draw();
    $('#siQ').oninput=e=>{ st.q=e.target.value; draw(); };
    $('#siManual').onclick=()=>{ $('#siMan').style.display='block'; $('#siManual').style.display='none'; $('#siName').focus(); };
    $('#siGo').onclick=()=>{ const name=$('#siName').value.trim(); if(!name){ toast('Enter your name'); return; }
      pick({name, unit:$('#siUnit').value.trim(), shift:''}); };
  });
}

weather(){
  const W=S.wx;
  if(!W.data && !W.loading && !W.err) loadWx();
  const locBar=`<div class="card" style="padding:10px 12px">
    <div class="row" style="gap:8px"><div style="min-width:0"><div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase">Weather for</div>
      <b style="font-size:16px">${esc(wxPlace())}</b>${W.loc.src==='gps'?' <span class="tag" style="font-size:10px">📍 Your location</span>':''}</div>
      <button class="btn primary" id="wxGps" style="margin-left:auto;white-space:nowrap;padding:9px 12px">📍 Use my location</button></div>
    ${W.msg?`<div class="muted" style="font-size:12.5px;margin-top:6px">${esc(W.msg)}</div>`:''}
    <div class="row" style="gap:6px;margin-top:8px"><input class="search" id="wxQ" placeholder="Or search a city (e.g. Moncks Corner)" style="margin:0;flex:1"><button class="btn" id="wxGo">Go</button></div>
    ${W.results?`<div style="margin-top:6px">${W.results.length? W.results.map((r,i)=>`<button class="crewbtn" data-wxr="${i}" style="padding:9px 11px;font-size:14.5px">${esc(r.name)}<span class="pos">${esc([r.admin2,r.admin1].filter(Boolean).join(', '))}</span></button>`).join('') : '<div class="muted" style="font-size:13px">No places found.</div>'}</div>`:''}
  </div>`;
  if(W.loading && !W.data) return `<h1>Weather</h1>${locBar}<div class="empty">Getting the weather…</div>`;
  if(!W.data || !W.data.om) return `<h1>Weather</h1>${locBar}<div class="empty">${esc(W.err||'Weather is not available right now.')}<br><button class="btn" id="wxRetry" style="margin-top:10px">Try again</button></div>`;
  const o=W.data.om, c=o.current, d=o.daily;
  const now=new Date(c.time); let hi=o.hourly.time.findIndex(t=>new Date(t)>=now); if(hi<0) hi=0;
  const hrs=o.hourly.time.slice(hi,hi+12).map((t,k)=>({t, temp:o.hourly.temperature_2m[hi+k], pop:o.hourly.precipitation_probability[hi+k], code:o.hourly.weather_code[hi+k], gust:o.hourly.wind_gusts_10m[hi+k]}));
  const alerts=((W.data.al&&W.data.al.features)||[]).map(f=>f.properties).filter(Boolean);
  const flags=[];
  const fl=c.apparent_temperature;
  if(fl>=103) flags.push(['r',`Heat index ${Math.round(fl)}° – danger range`]); else if(fl>=90) flags.push(['y',`Heat index ${Math.round(fl)}° – extreme caution`]); else if(fl>=80 && c.relative_humidity_2m>=40) flags.push(['y',`Heat index ${Math.round(fl)}° – caution`]);
  if(fl<=32) flags.push(['b',`Feels like ${Math.round(fl)}° – cold stress`]);
  const g12=Math.max(c.wind_gusts_10m, ...hrs.map(h=>h.gust||0));
  if(g12>=30) flags.push(['r',`Gusts to ${Math.round(g12)} mph in the next 12 h`]); else if(g12>=20) flags.push(['y',`Gusts to ${Math.round(g12)} mph in the next 12 h`]);
  const ts=hrs.find(h=>h.code>=95); if(c.weather_code>=95) flags.push(['r','Thunderstorm now – lightning']); else if(ts) flags.push(['r',`Thunderstorms possible ~${hhmm(new Date(ts.t))}`]);
  const rain=hrs.find(h=>h.pop>=50); if(rain && !ts) flags.push(['b',`Rain likely ~${hhmm(new Date(rain.t))} (${rain.pop}%)`]);
  const day=i=>i===0?'Today':i===1?'Tomorrow':new Date(d.time[i]+'T12:00').toLocaleDateString('en-US',{weekday:'long'});
  return `<h1>Weather</h1>${locBar}
  ${alerts.map(a=>`<div class="wxalert"><b>⚠️ ${esc(a.event)}</b><div style="font-size:13px">${esc(a.headline||'')}</div>${a.instruction?`<details style="margin-top:4px;font-size:12.5px"><summary>Details</summary>${esc(a.description||'')}<br><br>${esc(a.instruction)}</details>`:''}</div>`).join('')}
  <div class="card">
    <div class="wxnow"><div class="ic">${wxIcon(c.weather_code,c.is_day)}</div><div><div class="big">${Math.round(c.temperature_2m)}°</div></div>
      <div style="margin-left:4px"><b style="font-size:17px">${esc(wxText(c.weather_code))}</b><div class="muted" style="font-size:13px">Feels like ${Math.round(fl)}° · Hi ${Math.round(d.temperature_2m_max[0])}° / Lo ${Math.round(d.temperature_2m_min[0])}°</div></div></div>
    <div class="wxgrid">
      <div><b>${wxDir(c.wind_direction_10m)} ${Math.round(c.wind_speed_10m)}</b><span>Wind mph</span></div>
      <div><b>${Math.round(c.wind_gusts_10m)}</b><span>Gusts mph</span></div>
      <div><b>${c.relative_humidity_2m}%</b><span>Humidity</span></div>
      <div><b>${d.precipitation_probability_max[0]??'—'}%</b><span>Rain chance today</span></div>
      <div><b>${d.uv_index_max[0]!=null?Math.round(d.uv_index_max[0]):'—'}</b><span>UV index max</span></div>
      <div><b>${hhmm(new Date(d.sunset[0]))}</b><span>Sunset</span></div>
    </div>
    ${flags.length?`<div style="margin-top:10px">${flags.map(([k,t])=>`<span class="wxflag ${k}">${esc(t)}</span>`).join('')}</div>`:''}
  </div>
  <h2>Next 12 hours</h2>
  <div class="wxhours">${hrs.map(h=>`<div class="wxh"><div class="t">${new Date(h.t).toLocaleTimeString('en-US',{hour:'numeric'})}</div><div class="i">${wxIcon(h.code,1)}</div><div class="tp">${Math.round(h.temp)}°</div><div class="muted">💧${h.pop??0}%</div><div class="muted">G ${Math.round(h.gust||0)}</div></div>`).join('')}</div>
  <h2>3 days</h2>
  <div class="card" style="padding:4px 12px">${d.time.map((t,i)=>`<div class="row" style="padding:9px 0;border-bottom:${i<d.time.length-1?'1px solid var(--line)':'0'};gap:10px"><span style="font-size:22px">${wxIcon(d.weather_code[i],1)}</span>
     <div style="min-width:0"><b>${day(i)}</b><div class="muted" style="font-size:12px">${esc(wxText(d.weather_code[i]))} · 💧${d.precipitation_probability_max[i]??0}% · gusts ${Math.round(d.wind_gusts_10m_max[i])} mph</div></div>
     <div style="margin-left:auto;white-space:nowrap"><b>${Math.round(d.temperature_2m_max[i])}°</b> <span class="muted">${Math.round(d.temperature_2m_min[i])}°</span></div></div>`).join('')}</div>
  <p class="muted" style="font-size:12px;margin-top:10px">Updated ${esc(hhmm(new Date(W.at)))} · Forecast: Open-Meteo · Alerts: National Weather Service${alerts.length?'':' (no active alerts)'} ·
    <a href="https://forecast.weather.gov/MapClick.php?lat=${W.loc.lat}&lon=${W.loc.lon}" target="_blank" rel="noopener">NWS forecast ›</a></p>`;
},
help(){
  return `<h1>How to use</h1>
  <div class="card"><b>After a call or training</b><p class="sub" style="margin:6px 0 0">Menu ▸ <b>Log Used / Returned</b>. Pick what happened (Used, Returned, Needs replacing, Restocked), enter the incident #, set quantities, Save. On Hand updates for everyone.</p></div>
  <div class="card"><b>Single item</b><p class="sub" style="margin:6px 0 0">In <b>Logistics</b>, tap any item to log it by itself or see its details.</p></div>
  <div class="card"><b>Check-off</b><p class="sub" style="margin:6px 0 0">Walk the truck, enter counts, Submit. The counts become the new On Hand and show in the Activity Log.</p></div>
  <div class="card"><b>Restocking</b><p class="sub" style="margin:6px 0 0">The <b>Restock List</b> shows everything below full load, grouped by vendor with estimated cost. Tap <b>Restocked</b> when it's back on the truck.</p></div>
  <div class="card"><b>Signing in</b><p class="sub" style="margin:6px 0 0">Pick your shift and tap your name; your unit and shift go on every entry. Not on the list? Tap <b>Not on the list</b> and type it in. To switch, Menu ▸ <b>Switch user</b>.</p></div>

const ymd = ts => { const d=new Date(ts); if(isNaN(d)) return ''; return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const repKey = l => [l.kind||'', (l.details||'').trim().toLowerCase(), (l.incident||'').trim().toLowerCase()].join('|');
function repEvents(log){
  const m={}; log.filter(l=>l.kind && l.action!=='COUNT' && l.action!=='CHECK').forEach(l=>{ const k=repKey(l);
    const e=m[k]||(m[k]={key:k, kind:l.kind, details:l.details, incident:l.incident, first:l.ts, n:0, who:new Set()});
    e.n++; e.who.add(l.name+(l.unit?' – '+l.unit:'')); if(new Date(l.ts)<new Date(e.first)) e.first=l.ts; });
  return Object.values(m).sort((a,b)=>new Date(b.first)-new Date(a.first));
}
function repFilter(R){
  if(R.mode==='event') return R.all.filter(l=>repKey(l)===R.ev);
  return R.all.filter(l=>{ const d=ymd(l.ts);
    if(R.from && d<R.from) return false; if(R.to && d>R.to) return false;
    if(R.kind!=='All' && l.action!=='RESTOCKED' && l.kind!==R.kind) return false;
    return true; });
}
function repCost(rows,pmap){ const n={}; rows.forEach(l=>{ const s={USED:1,REPLACE:1,RETURNED:-1}[l.action]; if(s) n[rid(l)]=(n[rid(l)]||0)+s*(Number(l.qty)||0); });
  return Object.entries(n).reduce((t,[id,q])=>{ const p=pmap[id]&&pmap[id].price; return t+(p!=null&&p!==''&&q>0? q*Number(p):0); },0); }
function repTitle(R,evs){
  if(R.mode==='event'){ const e=evs.find(x=>x.key===R.ev); return e? `${e.kind}: ${e.details||'—'}${e.incident?' · #'+e.incident:''}` : 'Pick an incident or training'; }
  const f=s=>s? new Date(s+'T12:00').toLocaleDateString('en-US'):'';
  const span = R.from&&R.to? `${f(R.from)} – ${f(R.to)}` : R.from? `${f(R.from)} – today` : R.to? `Through ${f(R.to)}` : 'All time';
  return span + (R.kind==='All'?'':R.kind==='Incident'?' · Incidents only':' · Training only');
}
function repText(){
  const R=S.rep, evs=repEvents(R.all), rows=repFilter(R); const pmap=priceMap();
  const agg={}; rows.forEach(l=>{ const s={USED:1,REPLACE:1,RETURNED:-1}[l.action]; if(!s) return; agg[rid(l)]=(agg[rid(l)]||0)+s*(Number(l.qty)||0); });
  let tot=0; const lines=Object.entries(agg).filter(([,q])=>q>0).map(([id,q])=>{ const i=pmap[id]||{item:id,unit:''}; const c=i.price!=null&&i.price!==''? q*Number(i.price):null; if(c) tot+=c;
    return `${q} ${i.unit}  ${i.item}${c!=null?'  '+money(c):''}`; });
  return `USAR 301 – Usage Report\n${repTitle(R,evs)}\n\n${lines.length?lines.join('\n'):'Nothing used.'}\n\nTotal before tax: ${money(tot)}\nWith 7% tax: ${money(tot*1.07)}`;
}

/* who currently has kits out, from the log (Issued to / Returned by in notes) */
function kitHolders(id){
  const m={}; S.log.filter(l=>l.id===id).slice().reverse().forEach(l=>{
    const iss=/Issued to: ([^·|]+)/.exec(l.notes||''), ret=/Returned by: ([^·|]+)/.exec(l.notes||'');

function kitMissing(i){

  S.log.filter(l=>l.id===i.id).slice().reverse().forEach(l=>{
    const n=l.notes||'';
    if(l.action==='COUNT' && /^Kit check/.test(n)){ m={}; const mm=/Missing: (.*)$/.exec(n);
      if(mm) mm[1].split(',').forEach(x=>{ const r=/^(.*?) ×(\d+)$/.exec(x.trim()); if(r) m[r[1]]=+r[2]; }); }
    const rp=/Pieces replaced: ([^·]+)/.exec(n); if(l.action==='RESTOCKED'&&rp) rp[1].split(',').forEach(x=>{ delete m[x.trim()]; });
    const md=/Missing\/damaged: ([^·]+)/.exec(n); if(l.action==='RETURNED'&&md) md[1].split(',').forEach(x=>{ const k=x.trim(); m[k]=(m[k]||0)+1; });

            return `<div class="muted" style="font-size:12.5px;margin-top:8px">Check every piece: <b style="color:#1f7a3a">✓</b> it's there, <b style="color:#9b1c13">✕</b> missing or damaged. <b>${done}/${i.kit.length}</b></div>
            <div class="kitlist" style="margin-top:6px">${kitBody(i.kit,(k,x)=>`<div class="kr ${rk[k.n]==='x'?'miss':''} ${rk[k.n]==='ok'?'okk':''}"><span class="nm" style="flex:1">${esc(k.n)}</span>
              <button class="kc ${rk[k.n]==='ok'?'on':''}" data-rc="${x}" aria-label="${esc(k.n)} is there">✓</button><button class="kx ${rk[k.n]==='x'?'on':''}" data-rx="${x}" aria-label="${esc(k.n)} missing">✕</button></div>`,rOpen,k=>rk[k.n],'rsk')}</div>
            <div class="row" style="gap:8px;margin-top:10px"><button class="btn" id="retCancel" style="flex:1">Cancel</button><button class="btn ${all?'primary':''}" id="retOk" style="flex:2" ${all?'':'disabled'}>${all?'Confirm check-in'+(i.kit.some(k=>rk[k.n]==='x')?` · ${i.kit.filter(k=>rk[k.n]==='x').length} missing`:''):`Check every piece (${done}/${i.kit.length})`}</button></div>`; })():''}
        </div>`).join('') : `<div class="empty" style="padding:14px">No ${esc(i.item.toLowerCase())}s are checked out right now.</div>`}`; })()
    : kit&&(st.action==='PUSE'||st.action==='PRET')?(()=>{ const use=st.action==='PUSE', out=Object.fromEntries(pieceOut(i)), mis=Object.fromEntries(kitMissing(i)), kits=Math.max(0,Number(i.onHand)||0);
      const max=k=> use? Math.max(0,(Number(k.q)||1)*kits-(out[k.n]||0)-(mis[k.n]||0)) : (out[k.n]||0);
      const list=use? i.kit : i.kit.filter(k=>out[k.n]>0), tot=Object.values(pq).reduce((a,b)=>a+b,0);
      if(use&&!kits) return `<div class="empty" style="padding:14px;margin-top:10px">The ${esc(i.item)} isn't on the truck right now, so there are no pieces to pull.</div>`;
      if(!use&&!list.length) return `<div class="empty" style="padding:14px;margin-top:10px">No pieces are out of this kit right now.</div>`;
      return `<p class="muted" style="font-size:12.5px;margin:10px 0 6px">${use?'Set how many of each piece were pulled out. The kit stays on the truck.':'Set how many of each piece came back to the kit.'}</p>
      <div class="kitlist" style="margin-top:0">${kitBody(list,(k)=>{ const x=i.kit.indexOf(k), v=pq[k.n]||0, m=max(k);
        return `<div class="kr pcrow ${v?'on':''}"><span class="nm" style="flex:1">${esc(k.n)}<span class="pcav">${use?`${m} available in kit`:`${m} out`}</span></span>
          <div class="stepper"><button data-pm="${x}" ${v?'':'disabled'}>−</button><input data-pv="${x}" inputmode="numeric" value="${v}"><button data-pp="${x}" ${v<m?'':'disabled'}>+</button></div></div>`; },pOpen,k=>pq[k.n]?'ok':undefined,'psk')}</div>
      <label class="f">Notes (optional)</label><input class="in" id="sNote" value="${esc(note)}">
      <div style="height:12px"></div><button class="btn primary block" id="pSave" ${tot?'':'disabled'}>${tot?`${use?'Log':'Put back'} ${tot} piece${tot>1?'s':''}${use?' pulled from kit':' into kit'}`:'Pick at least one piece'}</button>`; })()
    : `<div class="row" style="margin-top:12px"><span class="muted">Quantity (${esc(i.unit)})</span>
      <div class="stepper" style="margin-left:auto"><button id="sDec">−</button><input id="sQty" inputmode="numeric" value="${qty}"><button id="sInc">+</button></div></div>
    ${kit?`<label class="f">${st.action==='RESTOCKED'?'Pieces replaced':'Pieces missing or damaged'} (tap any)</label><div>${i.kit.map((k,x)=>`<button class="pchip ${missing.has(k.n)?'on':''}" data-pc="${x}">${esc(k.n)}</button>`).join('')}</div>`:''}
    <label class="f">Notes (optional)</label><input class="in" id="sNote" value="${esc(note)}">
    <div style="height:12px"></div><button class="btn primary block" id="sSave">Save as ${ACTION_LABEL[st.action]}</button>`}
    ${hist.length?`<label class="f">Recent</label>`+hist.map(l=>`<div class="muted" style="font-size:12.5px;padding:3px 0">${esc(fmtTime(l.ts))} · ${ACTION_LABEL[l.action]} ${esc(l.qty)}${pieceOf(l)?' '+esc(pieceOf(l)):''} · ${esc(l.name)}</div>`).join(''):''}`, ()=>{
      const keep=()=>{ if($('#sQty')) qty=Number($('#sQty').value)||1; if($('#sNote')) note=$('#sNote').value; document.querySelectorAll('[data-iss]').forEach(x=>iss[+x.dataset.iss]=x.value); };
      const needCtx=()=>{ closeSheet(); if(S.route!=='inventory') go('inventory');
        setTimeout(()=>{ const c=document.querySelector('[data-p="l"]')?.closest('.card'); if(c){ c.classList.add('needctx'); c.scrollIntoView({block:'center'}); } },60);
        toast('Pick Incident or Training at the top first'); };
      document.querySelectorAll('[data-iss]').forEach(x=>x.oninput=()=>{ iss[+x.dataset.iss]=x.value; const b=$('#issSave'); const n=iss.filter(v=>v.trim()).length; if(b&&!b.disabled) b.textContent=`Issue ${n||''} ${i.item.toLowerCase()}${n>1?'s':''}`; });
      document.querySelectorAll('[data-issrm]').forEach(b=>b.onclick=()=>{ keep(); iss.splice(+b.dataset.issrm,1); draw(); });
      const ia=$('#issAdd'); if(ia) ia.onclick=()=>{ keep(); iss.push(''); draw(); setTimeout(()=>{ const l=document.querySelector(`[data-iss="${iss.length-1}"]`); l&&l.focus(); },50); };
      const is=$('#issSave'); if(is) is.onclick=async()=>{ keep();
        const list=iss.map(x=>x.trim()).filter(Boolean);
        if(!list.length){ toast('Enter who it is issued to'); return; }
        const dup=list.find((x,k)=>list.findIndex(y=>y.toLowerCase()===x.toLowerCase())!==k); if(dup){ toast(dup+' is listed twice'); return; }
        if(list.length>(i.onHand??0)){ toast(`Only ${i.onHand??0} on the truck`); return; }
        if(!ctxReady()){ needCtx(); return; }
        const extra=($('#sNote').value||'').trim();
        const ok=await submit({action:'USED', lines:list.map(n=>({id, qty:1, note:'Issued to: '+n+(extra?' · '+extra:'')})), incident:st.kind==='Incident'?st.incident.trim():'', details:st.details.trim(), notes:'', kind:st.kind});
        if(ok){ closeSheet(); toast(`Issued to ${list.join(', ')}`); } };
      document.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{ keep(); const g=b.dataset.sk; kOpen.has(g)?kOpen.delete(g):kOpen.add(g); draw(); });
      document.querySelectorAll('[data-rsk]').forEach(b=>b.onclick=()=>{ const g=b.dataset.rsk; rOpen.has(g)?rOpen.delete(g):rOpen.add(g); draw(); });
      document.querySelectorAll('[data-ret]').forEach(b=>b.onclick=()=>{ ret=b.dataset.ret; rk={}; draw(); });
      document.querySelectorAll('[data-rc]').forEach(b=>b.onclick=()=>{ const n=i.kit[+b.dataset.rc].n; rk[n]=rk[n]==='ok'?undefined:'ok'; if(!rk[n]) delete rk[n]; draw(); });
      document.querySelectorAll('[data-rx]').forEach(b=>b.onclick=()=>{ const n=i.kit[+b.dataset.rx].n; rk[n]=rk[n]==='x'?undefined:'x'; if(!rk[n]) delete rk[n]; draw(); });
      const rc=$('#retCancel'); if(rc) rc.onclick=()=>{ ret=null; rk={}; draw(); };
      const ro=$('#retOk'); if(ro) ro.onclick=async()=>{
        // use the top Incident/Training if set, otherwise the one this kit was issued under
        let kind=st.kind, details=st.details, incident=st.incident;
        if(!ctxReady()){ const src=S.log.find(l=>l.id===id && l.action==='USED' && (l.notes||'').includes('Issued to: '+ret));
          if(src&&src.kind){ kind=src.kind; details=src.details; incident=src.incident; } else { needCtx(); return; } }
        if(i.kit.some(k=>!rk[k.n])){ toast('Check every piece first'); return; }
        const mis=i.kit.filter(k=>rk[k.n]==='x').map(k=>k.n);
        const nt='Returned by: '+ret+(mis.length?' · Missing/damaged: '+mis.join(', '):' · All pieces checked');
        const ok=await submit({action:'RETURNED', lines:[{id, qty:1, note:nt}], incident:kind==='Incident'?(incident||'').trim():'', details:(details||'').trim(), notes:'', kind});
        if(ok){ const who=ret; ret=null; closeSheet(); toast(`Checked in from ${who}`+(mis.length?` · ${mis.length} missing`:' · all there')); } };
      const kmax=Math.max(1,i.onHand??i.full??1);
      document.querySelectorAll('[data-kc]').forEach(b=>b.onclick=()=>{ keep(); const n=i.kit[+b.dataset.kc].n; if(ck[n]==='ok') delete ck[n]; else ck[n]='ok'; draw(); });
      document.querySelectorAll('[data-kx]').forEach(b=>b.onclick=()=>{ keep(); const n=i.kit[+b.dataset.kx].n; if(ck[n]!==undefined&&ck[n]!=='ok') delete ck[n]; else ck[n]=1; draw(); });
      document.querySelectorAll('[data-kp]').forEach(b=>b.onclick=()=>{ keep(); const n=i.kit[+b.dataset.kp].n; ck[n]=Math.min(kmax*i.kit[+b.dataset.kp].q,(ck[n]||0)+1); draw(); });
      document.querySelectorAll('[data-km]').forEach(b=>b.onclick=()=>{ keep(); const n=i.kit[+b.dataset.km].n; ck[n]=(ck[n]||1)-1; if(ck[n]<=0) delete ck[n]; draw(); });
      const saveCheck=async()=>{ const miss=Object.entries(ck).filter(([,q])=>q!=='ok'&&q>0);
        const notes = !miss.length ? `Kit check: all pieces present in ${i.onHand??i.full} ${i.unit==='KIT'?'kits':i.unit}` : `Kit check – Missing: ${kitMissTxt(miss)}`;
        const ok=await submit({action:'COUNT', lines:[{id, qty:i.onHand??i.full??0}], notes});
        if(ok){ closeSheet(); toast(miss.length?'Kit check saved: '+kitMissTxt(miss)+' missing':'Kit check saved: all there'); } };
      const ks=$('#kSave'); if(ks) ks.onclick=()=>saveCheck(false);
      document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{ const n=i.kit[+b.dataset.pc].n; missing.has(n)?missing.delete(n):missing.add(n); b.classList.toggle('on');
        const r=$('#retOk'); if(r) r.textContent='Confirm check-in'+(missing.size?` · ${missing.size} missing`:''); });
      document.querySelectorAll('[data-sa]').forEach(b=>b.onclick=()=>{ keep(); if(st.action!==b.dataset.sa) pq={}; st.action=b.dataset.sa; draw(); });
      // pieces pulled from / put back into the kit
      { const use=st.action==='PUSE', out=Object.fromEntries(pieceOut(i)), mis=Object.fromEntries(kitMissing(i)), kits=Math.max(0,Number(i.onHand)||0);
        const max=k=> use? Math.max(0,(Number(k.q)||1)*kits-(out[k.n]||0)-(mis[k.n]||0)) : (out[k.n]||0);
        const setq=(x,v)=>{ keep(); const k=i.kit[x]; v=Math.max(0,Math.min(max(k),Number(v)||0)); if(v) pq[k.n]=v; else delete pq[k.n]; draw(); };
        document.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>setq(+b.dataset.pp,(pq[i.kit[+b.dataset.pp].n]||0)+1));
        document.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>setq(+b.dataset.pm,(pq[i.kit[+b.dataset.pm].n]||0)-1));
        document.querySelectorAll('[data-pv]').forEach(n=>n.onchange=()=>setq(+n.dataset.pv,n.value));
        document.querySelectorAll('[data-psk]').forEach(b=>b.onclick=()=>{ keep(); const g=b.dataset.psk; pOpen.has(g)?pOpen.delete(g):pOpen.add(g); draw(); });
        const ps=$('#pSave'); if(ps) ps.onclick=async()=>{ keep(); const ent=Object.entries(pq).filter(([,q])=>q>0); if(!ent.length) return;
          let kind=st.kind, details=st.details, incident=st.incident;
          if(!ctxReady()){ const src=!use && S.log.find(l=>l.id===id && l.action==='USED' && pieceOf(l) && l.kind);
            if(src){ kind=src.kind; details=src.details; incident=src.incident; } else { needCtx(); return; } }
          const ok=await submit({action:use?'USED':'RETURNED', lines:ent.map(([n,q])=>({id, qty:q, piece:n, note:note.trim()})), incident:kind==='Incident'?(incident||'').trim():'', details:(details||'').trim(), notes:'', kind});
          if(ok){ const n=ent.reduce((a,[,q])=>a+q,0); pq={}; closeSheet(); toast(use?`Logged ${n} piece${n>1?'s':''} pulled from ${i.item}`:`Put ${n} piece${n>1?'s':''} back in ${i.item}`); } };
      }
      if(!$('#sSave')) return;
      $('#sDec').onclick=()=>{ $('#sQty').value=Math.max(0,(Number($('#sQty').value)||0)-1); };
      $('#sInc').onclick=()=>{ $('#sQty').value=(Number($('#sQty').value)||0)+1; };
      $('#sSave').onclick=async()=>{ const q=Number($('#sQty').value)||0; if(!q){ toast('Enter a quantity'); return; }
        if(NEEDS_KIND(st.action) && !ctxReady()){
          closeSheet(); if(S.route!=='inventory') go('inventory');
          setTimeout(()=>{ const c=document.querySelector('[data-p="l"]')?.closest('.card'); if(c){ c.classList.add('needctx'); c.scrollIntoView({block:'center'}); } },60);
          toast('Pick Incident or Training at the top first'); return; }
        const nk=NEEDS_KIND(st.action);
        let notes=$('#sNote').value.trim();
        if(kit){ const parts=[];
          if(missing.size) parts.push((st.action==='RESTOCKED'?'Pieces replaced: ':'Missing/damaged: ')+[...missing].join(', '));
          if(notes) parts.push(notes); notes=parts.join(' · '); }
        const ok=await submit({action:st.action, lines:[{id, qty:q}], incident:nk&&st.kind==='Incident'?st.incident.trim():'', details:nk?st.details.trim():'', notes, kind:nk?st.kind:''});
        if(ok){ closeSheet(); toast(`${ACTION_LABEL[st.action]}: ${q} × ${i.item}`); } };
    });
  draw();
}

  document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{ S.inv={q:'',cat:'All',st:b.dataset.tile}; go('inventory'); }); },
inventory(){
  const q=$('#invQ'); q.oninput=()=>{ S.inv.q=q.value; const pos=q.selectionStart; render(); const n=$('#invQ'); n.focus(); n.setSelectionRange(pos,pos); };
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{ S.inv.cat=b.dataset.cat; render(); });
  document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ S.inv.st=b.dataset.st; render(); });

  document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ const l=b.dataset.sec; secState[l]=!secOpen(l,filt); sset(SEC_KEY,JSON.stringify(secState)); const y=b.getBoundingClientRect().top; render(); const n=document.querySelector(`[data-sec="${CSS.escape(l)}"]`); if(n) window.scrollBy(0,n.getBoundingClientRect().top-y); });
  const sa=$('#secAll'); if(sa) sa.onclick=()=>{ const locs=[...document.querySelectorAll('[data-sec]')].map(b=>b.dataset.sec); const open=sa.textContent.trim()==='Expand all'; locs.forEach(l=>secState[l]=open); sset(SEC_KEY,JSON.stringify(secState)); render(); };
  bindKind(S.ctx,'l',()=>{ S.ctxEdit=true; render(); });
  const lc=$('#lCtxChg'); if(lc) lc.onclick=()=>{ S.ctxEdit=true; render(); };
  const ld=$('#lDet'); if(ld) ld.addEventListener('blur',()=>{ if(ctxReady()){ S.ctxEdit=false; } });
},
quick(){

  const qc=$('#qCtxChg'); if(qc) qc.onclick=()=>{ S.ctxEdit=true; render(); };

    b.textContent=`Save ${picked? picked+' item'+(picked>1?'s':''):''} as ${ACTION_LABEL[Q.action]}`; };
  document.querySelectorAll('[data-qty]').forEach(inp=>inp.oninput=()=>{ Q.qty[inp.dataset.qty]=Math.max(0,Number(inp.value)||0); upd(); });
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{ const id=b.dataset.inc; Q.qty[id]=(Q.qty[id]||0)+1; document.querySelector(`[data-qty="${id}"]`).value=Q.qty[id]; upd(); });
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{ const id=b.dataset.dec; Q.qty[id]=Math.max(0,(Q.qty[id]||0)-1); document.querySelector(`[data-qty="${id}"]`).value=Q.qty[id]||''; upd(); });

},
checkoff(){
  const C=S.check;
  const byLoc={}; S.items.forEach(i=>(byLoc[i.loc]=byLoc[i.loc]||[]).push(i));
  const tcProb=()=> TRUCK_CHECKS.some(([k])=>C.tc[k]==='x');
  const tcDone=()=> String(C.miles).trim()!=='' && TRUCK_CHECKS.every(([k])=>C.tc[k]) && (!tcProb() || String(C.tnotes||'').trim()!=='');
  const upd=()=>{ const n=Object.keys(C.counts).length; const b=$('#cSave'); const ok=tcDone(); b.disabled=!ok;
    b.textContent= ok? `Submit check-off (truck check + ${n} item${n===1?'':'s'} counted)` : (String(C.miles).trim()!=='' && TRUCK_CHECKS.every(([k])=>C.tc[k]) && tcProb() ? 'Add a Truck Check note explaining the problem' : 'Finish the Truck Check at the top to submit');
    const tn=$('#cTNotes'); if(tn) tn.classList.toggle('needctx-in', tcProb() && !String(C.tnotes||'').trim());
    const tp=$('#tcProg'); if(tp){ tp.textContent=ok?'Done':'Required'; tp.classList.toggle('done',ok); }
    document.querySelectorAll('[data-prog]').forEach(p=>{ const its=byLoc[p.dataset.prog]||[]; const k=its.filter(i=>C.counts[i.id]!==undefined).length;
      p.textContent=`${k} / ${its.length}${k===its.length?' ✓':''}`; p.classList.toggle('done', k===its.length); });
    document.querySelectorAll('[data-clr1]').forEach(x=>{ x.hidden = C.counts[x.dataset.clr1]===undefined; }); };
  const setVal=(id,v)=>{ const el=document.querySelector(`[data-count="${id}"]`); if(el) el.value=v; };
  document.querySelectorAll('[data-count]').forEach(inp=>inp.oninput=()=>{ const id=inp.dataset.count;
    if(inp.value==='') delete C.counts[id]; else C.counts[id]=Math.max(0,Number(inp.value)||0); upd(); });
  document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>{
    const its=byLoc[b.dataset.match]||[]; let skipped=0;
    its.forEach(i=>{ if(i.full==null){ skipped++; return; } C.counts[i.id]=i.full; setVal(i.id,i.full); });
    upd(); toast(skipped? `Section set to full load · ${skipped} item${skipped>1?'s':''} with no full load – count by hand` : 'Section set to full load'); });
  const bump=(id,d)=>{ const cur=C.counts[id]; const v=Math.max(0,(cur===undefined?0:cur)+d); C.counts[id]=v; setVal(id,v); upd(); };
  document.querySelectorAll('[data-cinc]').forEach(b=>b.onclick=()=>bump(b.dataset.cinc,1));
  document.querySelectorAll('[data-cdec]').forEach(b=>b.onclick=()=>bump(b.dataset.cdec,-1));
  document.querySelectorAll('[data-clr1]').forEach(b=>b.onclick=()=>{ const id=b.dataset.clr1; delete C.counts[id]; setVal(id,''); upd(); });
  $('#cClearAll').onclick=()=>{
    const b=$('#cClearAll');
    if(b.dataset.armed){ Object.keys(C.counts).forEach(id=>setVal(id,'')); C.counts={}; delete b.dataset.armed; b.textContent='Clear all counts'; b.classList.remove('danger'); upd(); toast('All counts cleared'); }
    else { b.dataset.armed='1'; b.textContent='Tap again to clear every count'; b.classList.add('danger'); setTimeout(()=>{ if(b.dataset.armed){ delete b.dataset.armed; b.textContent='Clear all counts'; b.classList.remove('danger'); } },4000); }
  };
  upd();
  document.querySelectorAll('[data-cosec]').forEach(b=>b.onclick=()=>{ const l=b.dataset.cosec; coState[l]=!(coState[l]===true); sset(CO_KEY,JSON.stringify(coState));
    const y=b.getBoundingClientRect().top; render(); const n=document.querySelector(`[data-cosec="${CSS.escape(l)}"]`); if(n) window.scrollBy(0,n.getBoundingClientRect().top-y); });
  const ca=$('#coAll'); if(ca) ca.onclick=()=>{ const open=ca.textContent.trim()==='Expand all'; Object.keys(byLoc).forEach(l=>coState[l]=open); sset(CO_KEY,JSON.stringify(coState)); render(); };
  document.querySelectorAll('[data-snote]').forEach(x=>x.oninput=()=>{ C.sn[x.dataset.snote]=x.value; });
  $('#cTNotes').oninput=e=>{ C.tnotes=e.target.value; upd(); };
  $('#cStart').onchange=e=>{ C.started=e.target.value||localDT(new Date()); };
  $('#cMiles').oninput=e=>{ C.miles=e.target.value.replace(/[^\d]/g,''); if(e.target.value!==C.miles) e.target.value=C.miles; upd(); };
  document.querySelectorAll('[data-tck]').forEach(b=>b.onclick=()=>{ const k=b.dataset.tck, v=b.dataset.v; C.tc[k]= C.tc[k]===v? undefined : v; if(!C.tc[k]) delete C.tc[k];
    const row=b.closest('.kr'); row.classList.toggle('okk',C.tc[k]==='ok'); row.classList.toggle('miss',C.tc[k]==='x');
    row.querySelector('.kc').classList.toggle('on',C.tc[k]==='ok'); row.querySelector('.kx').classList.toggle('on',C.tc[k]==='x'); upd(); });
  $('#cSave').onclick=async()=>{
    if(!tcDone()){ toast('Finish the Truck Check first'); window.scrollTo(0,0); return; }
    const miles=Number(C.miles), lm=lastMiles();
    if(lm!=null && miles<lm && !$('#cSave').dataset.ok){ $('#cSave').dataset.ok='1'; toast(`Mileage is lower than last (${lm.toLocaleString('en-US')}). Tap Submit again if it's right.`); return; }
    const probs=TRUCK_CHECKS.filter(([k])=>C.tc[k]==='x').map(([,n])=>n);
    const truck=`Started: ${fmtDT(C.started)} · Mileage: ${miles.toLocaleString('en-US')} · `+TRUCK_CHECKS.map(([k,n])=>`${n}: ${C.tc[k]==='ok'?'✓':'✕'}`).join(' · ')+(probs.length?` · PROBLEM: ${probs.join(', ')}`:'')+(String(C.tnotes||'').trim()?` · Notes: ${String(C.tnotes).trim()}`:'');
    const lines=Object.entries(C.counts).map(([id,qty])=>({id,qty}));
    const secNotes=Object.entries(C.sn).filter(([,v])=>String(v||'').trim()).map(([loc,note])=>({loc, note:String(note).trim()}));
    if(await submit({action:'COUNT', lines, notes:'', truck, secNotes})){ S.check=null; toast(`Check-off saved: truck check${lines.length?' + '+lines.length+' items':''}${probs.length?' · '+probs.length+' problem'+(probs.length>1?'s':''):''}`); go('home'); }
  };
}
};

S.route = 'home';
refresh().then(()=>{ if(!S.me) signIn(()=>render()); });
</script>
</body>
</html>
